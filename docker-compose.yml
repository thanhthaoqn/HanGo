services:
  backend:
    image: hango-backend:latest
    build:
      context: ./hango-backend
      dockerfile: Dockerfile
    container_name: hango-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    restart: always

  frontend:
    image: hango-frontend:latest
    build:
      context: .
      dockerfile: hango-frontend/Dockerfile
    container_name: hango-frontend
    expose:
      - "80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: hango-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: hango-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0; while true; do sleep 12h & wait $${!}; certbot renew; done'"
