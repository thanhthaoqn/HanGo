# =========================================================================
# STEP 1: Nginx Configuration for Port 80 (HTTP) & Let's Encrypt validation
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hangog92.online www.hangog92.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy HTTP traffic to frontend initially (during SSL setup)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect to HTTPS once SSL cert is active (uncomment this after Step 2)
    # return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.hangog92.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy HTTP traffic to backend initially (during SSL setup)
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect to HTTPS once SSL cert is active (uncomment this after Step 2)
    # return 301 https://$host$request_uri;
}

