spring.application.name=hango-backend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hango_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload (for Video)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB

# JWT Configuration
hango.jwt.secret=${HANGO_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
hango.jwt.expirationMs=86400000
hango.jwt.refreshExpirationMs=2592000000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

google.client-id=${GOOGLE_CLIENT_ID}

# Gemini / AI Assistant Configuration
hango.gemini.api-key=${HANGO_GEMINI_API_KEY}
hango.gemini.base-url=https://generativelanguage.googleapis.com
hango.gemini.chat-model=gemini-3.1-flash-lite
hango.gemini.embedding-model=text-embedding-004
hango.gemini.timeout-seconds=60

# Logging Configuration
logging.level.com.hango.hango_backend=INFO
logging.level.com.hango.hango_backend.service.PaymentServiceImpl=DEBUG
logging.level.org.hibernate.SQL=WARN

# Spring Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
