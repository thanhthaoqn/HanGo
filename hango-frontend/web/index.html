<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HanGo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>HanGo</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Guard against known Flutter Web DDC bootstrap issue where 'dart-app-ready'
    // fires multiple times and causes removeChild on an already removed element.
    (function() {
      const origAddEventListener = EventTarget.prototype.addEventListener;
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (type === 'dart-app-ready' && typeof listener === 'function') {
          const safeListener = function(event) {
            try {
              return listener.apply(this, arguments);
            } catch (e) {
              if (e instanceof TypeError && e.message && e.message.includes('removeChild')) {
                console.debug('Handled benign Flutter DDC bootstrap cleanup:', e.message);
                return;
              }
              throw e;
            }
          };
          return origAddEventListener.call(this, type, safeListener, options);
        }
        return origAddEventListener.call(this, type, listener, options);
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
